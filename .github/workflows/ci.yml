name: DevOps CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Selenium Tests
        run: |
          python test.py

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t devops-demo-app .

      - name: Run Docker Container (Test Deployment)
        run: docker run -d -p 8888:80 --name devops-container devops-demo-app

      - name: Verify Deployment
        run: |
          sleep 5
          curl -v --fail http://localhost:8888 || (docker logs devops-container && exit 1)
